name: Validate framework

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run framework unit tests
        run: python3 -m unittest discover -s tests

  full-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile tools
        run: python3 -m py_compile framework/tools/*.py install.py
      - name: Run framework unit tests
        run: python3 -m unittest discover -s tests
      - name: Install and lint sanitized example
        run: |
          vault="$(mktemp -d)"
          python3 install.py --vault "$vault"
          test -f "$vault/contracts/behaviour-inventory.json"
          python3 "$vault/tools/contracts.py" lint
          test -f "$vault/skills/dtm/SKILL.md"
          test -f "$vault/skills/voice/SKILL.md"
          test -f "$vault/tools/workspaces.py"
          python3 "$vault/tools/wiki.py" lint
          python3 "$vault/tools/dtm.py" lint
          python3 "$vault/tools/workspaces.py" lint
          python3 "$vault/tools/documents.py" lint
          python3 "$vault/tools/writing.py" lint
